name: Qualcomm Internal ASan

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:

jobs:
  asan-linux-x86_64:
    name: "asan-linux-x86_64"
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # submodules omitted here; initialized below only when ASan is needed.

      - name: Check if ASan is needed
        id: gate
        run: |
          set -euo pipefail

          # Explicitly requested runs (Actions tab, maintainer `/ci`) always run in full:
          # there is no PR diff to narrow them down to.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Resolve the base to diff against. Only pull_request populates github.base_ref;
          # merge_group carries its base under github.event.merge_group. Any other event has no
          # diff base, so fail toward running (same bias as build-and-test.yml's path-filter)
          # rather than erroring out and reporting a red check.
          base_ref="${{ github.base_ref }}"
          if [ -z "${base_ref}" ]; then
            merge_group_base="${{ github.event.merge_group.base_ref }}"
            base_ref="${merge_group_base#refs/heads/}"
          fi
          if [ -z "${base_ref}" ]; then
            echo "No diff base for event_name=${{ github.event_name }}; running full ASan."
            echo "run=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if ! changed=$(git diff --name-only "origin/${base_ref}...HEAD"); then
            echo "::error::git diff against origin/${base_ref}...HEAD failed"
            exit 1
          fi

          # Trigger ASan when QNN EP source/test code changes, or when the
          # ASan pipeline files themselves change so pipeline edits don't
          # land unvalidated (chicken-and-egg with the gate itself).
          if echo "${changed}" | grep -qE \
              -e 'onnxruntime/(core|test)/providers/qnn/' \
              -e '^\.github/workflows/qualcomm-internal-asan\.yml$' \
              -e '^qcom/scripts/linux/(run_asan|asan_filter_leaks)\.sh$' \
              -e '^tools/ci_build/lsan_suppressions\.txt$'; then
            echo "run=true" >> "${GITHUB_OUTPUT}"
          else
            echo "run=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Initialize submodules
        if: steps.gate.outputs.run == 'true'
        run: git submodule update --init --recursive

      - name: Run ASan build and unit tests (Linux x86_64, Debug)
        if: steps.gate.outputs.run == 'true'
        run: |
          python3 qcom/build_and_test.py \
            --target-py-version None \
            asan_linux_x86_64
