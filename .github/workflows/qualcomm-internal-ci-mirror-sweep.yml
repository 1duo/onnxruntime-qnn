# Deletes the `ci-fork/pr-<number>-<fork sha>-<base sha>` mirror branches created by
# qualcomm-internal-ci-trigger.yml when a maintainer runs `/ci` on a fork PR, so mirrored fork code
# does not accumulate as branches of this repo (visible to every cloner, and re-dispatchable long
# after the PR closed).
#
# This runs on a schedule rather than on PR close: a Tier-2 device run can outlive the merge of the
# PR that requested it, and its jobs check out the ref long after they are queued, so deleting on
# the close transition would fail the run and look like a device regression. A mirror is removed
# once nothing is running against it and its PR is closed, and unconditionally once it has gone a
# week unused — the age backstop overrides the other checks so a permanently queued run (offline
# device runner) cannot pin fork code here forever.
#
# qualcomm-internal-ci-trigger.yml already deletes the mirrors a new `/ci` supersedes, so in
# practice this handles the ones left behind by a closed PR or an abandoned run.

name: Qualcomm Internal CI Mirror Sweep

permissions: {}

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

# A manual sweep and the cron overlapping would race on the same refs.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sweep:
    name: Delete stale fork CI mirror branches
    permissions:
      # A permissions block sets every unlisted scope to none, so pull-requests must be listed:
      # without it pulls.get 403s and the sweep never deletes anything.
      contents: write      # to delete ci-fork/* mirror refs
      actions: read        # to see whether a run is still using a mirror
      pull-requests: read  # to see whether a mirror's PR is still open
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - name: Delete ci-fork mirrors with no active run
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const STALE_MS = 7 * 24 * 60 * 60 * 1000;

            const refs = await github.paginate(github.rest.git.listMatchingRefs, {
              owner,
              repo,
              ref: 'heads/ci-fork/',
              per_page: 100,
            });
            if (refs.length === 0) {
              core.info('No ci-fork/* mirrors present.');
              return;
            }
            const failures = [];

            for (const { ref: fullRef, object } of refs) {
              const branch = fullRef.replace(/^refs\/heads\//, '');
              // Only names this feature creates are swept, however old: something outside it may
              // own another `ci-fork/*` ref, and the age backstop must not become a way to delete
              // refs this sweep cannot reason about.
              const match = branch.match(/^ci-fork\/pr-(\d+)(?:-|$)/);
              if (!match) {
                core.info(`${branch}: not a mirror this sweep owns, leaving it alone.`);
                continue;
              }
              const prNumber = Number(match[1]);

              // One unhealthy ref (a transient 5xx, a missing scope) must not abandon the rest of
              // the pass; failures are collected and reported at the end so a permanent problem
              // shows up as a red sweep rather than a sweep that silently deletes nothing.
              try {
              const commit = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: object.sha,
              });
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'qualcomm-internal-ci.yml',
                branch,
                per_page: 100,
              });

              // Age is measured from the last time the mirror was used, not from when it was
              // created: a repeat `/ci` with the same fork and base commits reuses the existing
              // ref, so keying on the commit date alone would let the backstop delete a ref out
              // from under a run dispatched days later.
              const lastUsed = Math.max(
                new Date(commit.data.committer.date).getTime(),
                ...runs.data.workflow_runs.map((r) => new Date(r.created_at).getTime()),
              );
              const stale = Date.now() - lastUsed >= STALE_MS;

              // The age backstop overrides everything below, so a run wedged in `queued` forever
              // (an offline QDC/Test runner) cannot pin fork code in this repo indefinitely.
              if (!stale) {
                // A run checks out the mirror well after it is queued, so never delete while one
                // is live; it keeps the mirror until a later pass.
                if (runs.data.workflow_runs.some((r) => r.status !== 'completed')) {
                  core.info(`${branch}: run still active, keeping.`);
                  continue;
                }

                // Keep a mirror while its PR is open: the maintainer may still be reading its
                // results.
                let prOpen = false;
                try {
                  const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                  prOpen = pr.data.state === 'open';
                } catch (e) {
                  if (e.status !== 404) throw e; // PR gone: treat as closed
                }
                if (prOpen) {
                  core.info(`${branch}: PR #${prNumber} still open, keeping.`);
                  continue;
                }
              }

              // Tolerate a concurrent pass (a manual dispatch overlapping the cron) having already
              // deleted this ref, so one 404 does not abandon the rest of the sweep.
              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `heads/${branch}` });
                core.info(`Deleted ${branch}${stale ? ' (stale)' : ''}.`);
              } catch (e) {
                if (e.status !== 404 && e.status !== 422) throw e;
                core.info(`${branch}: already gone.`);
              }
              } catch (e) {
                failures.push(`${branch}: ${e.message}`);
                core.warning(`${branch}: skipped this pass (${e.message}).`);
              }
            }

            if (failures.length > 0) {
              core.setFailed(`Could not sweep ${failures.length} mirror(s):\n${failures.join('\n')}`);
            }
