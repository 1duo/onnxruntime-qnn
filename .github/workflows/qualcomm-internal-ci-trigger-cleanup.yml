# Deletes the `ci-fork/pr-<number>` mirror branch created by qualcomm-internal-ci-trigger.yml
# when a maintainer runs `/ci` on a fork PR, so mirrored fork code does not accumulate as
# branches of this repo (visible to every cloner, and re-dispatchable long after the PR closed).
#
# pull_request_target is used because the base-repo token is needed to delete a ref and fork PRs
# get a read-only token. It is safe here: this workflow never checks out or executes PR code.

name: Qualcomm Internal CI Trigger Cleanup

permissions: {}

on:
  pull_request_target:
    types: [closed]

jobs:
  delete-mirror:
    name: Delete fork CI mirror branch
    permissions:
      contents: write # to delete the ci-fork/pr-<number> mirror ref
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - name: Delete ci-fork mirror branch if present
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const ref = `heads/ci-fork/pr-${context.payload.pull_request.number}`;
            try {
              await github.rest.git.deleteRef({ owner, repo, ref });
              core.info(`Deleted ${ref}`);
            } catch (e) {
              if (e.status === 404 || e.status === 422) {
                core.info(`No mirror branch ${ref} to delete.`);
                return;
              }
              throw e;
            }
