# Lets a maintainer trigger CI by commenting "/ci" (optionally "/ci <sha>") on a PR.
# Two cases it exists for:
#   * draft PRs, which don't auto-trigger CI (see qualcomm-internal-ci.yml);
#   * fork PRs, where Tier 2 (device/QDC/wheel-smoke) is skipped because forks get no secrets.
#
# Fork handling. workflow_dispatch resolves BOTH the ref to build and the workflow definitions
# from the dispatched ref, and a fork head branch does not exist in this repo (dispatching it
# fails 422 "No ref found"). So a fork PR is mirrored to `ci-fork/pr-<number>`: a commit whose
# tree is the fork's tree with `.github/` replaced by this repo's default-branch `.github/`, so
# the workflow definitions, permissions and secret plumbing that run are always trusted ones and
# a fork cannot inject `run:` steps into a secrets-bearing workflow. A fork's edits under
# `.github/` are therefore NOT exercised by `/ci`; review those by reading the diff.
#
# What `/ci` still does is build and test the fork's source and build scripts (qcom/, cmake,
# tests) on internal runners with Artifactory/QDC secrets in the environment. That is inherent
# to running fork code at all, so `/ci` is a deliberate maintainer action: read the diff first.
# Only users with write/maintain/admin permission on this repo can trigger it — author_association
# is a cheap prefilter only (it reports COLLABORATOR for read-only collaborators and MEMBER for
# any org member), so the real check is repos.getCollaboratorPermissionLevel below.
#
# The mirror commit has its own SHA, so Tier 2 results land on the mirror, not on the PR head.
# They do not overwrite the PR's green Tier-2 placeholders (a fork PR stays mergeable); read them
# from the run link in the acknowledgement comment. Mirror branches are deleted when the PR
# closes by qualcomm-internal-ci-trigger-cleanup.yml.

name: Qualcomm Internal CI Trigger

permissions: {}

on:
  issue_comment:
    types: [created]

# Serialize per PR so two quick `/ci` comments cannot race on the mirror ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger CI from PR comment
    # Cheap prefilter only. Both conditions are re-checked precisely in the script: expression
    # strings have no escape sequences (so a `'/ci\n'` prefix test is the dead literal `/ci\n`,
    # not a newline), and author_association does not imply write access.
    if: |
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/ci') &&
      contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'),
               github.event.comment.author_association)
    permissions:
      contents: write       # to create/update the ci-fork/pr-<number> mirror ref for fork PRs
      pull-requests: write  # to post the acknowledgement comment
      actions: write        # to dispatch qualcomm-internal-ci.yml via createWorkflowDispatch
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - name: Dispatch CI workflow on PR branch
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comment = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number, body });

            // The job `if` is a prefilter: parse the command precisely here. Anything after
            // `/ci` on the first line must be a commit sha; a malformed argument is rejected
            // rather than silently treated as an unpinned run.
            const firstLine = context.payload.comment.body.split(/\r?\n/, 1)[0].trim();
            if (!/^\/ci(\s|$)/.test(firstLine)) return; // e.g. "/citation", not the command
            const arg = firstLine.slice('/ci'.length).trim();
            if (arg && !/^[0-9a-f]{7,40}$/i.test(arg)) {
              await comment(
                `⛔ Could not read \`${arg}\` as a commit sha. Use \`/ci\` to run against the ` +
                'current head, or `/ci <sha>` (7-40 hex chars) to pin a reviewed commit.',
              );
              return;
            }

            // author_association in the job `if` does not imply write access: COLLABORATOR
            // includes read/triage-only collaborators and MEMBER is any org member. Check the
            // actual permission level before touching refs or dispatching secrets-bearing work.
            // The endpoint 404s for a user with no access at all, which is also "no permission".
            let permission = 'none';
            try {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: context.actor,
              });
              permission = perm.data.permission;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            if (!['admin', 'maintain', 'write'].includes(permission)) {
              await comment(
                `⛔ \`/ci\` needs write access to this repository (@${context.actor} has ` +
                `\`${permission}\`).`,
              );
              return;
            }

            const pr = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const branch = pr.data.head.ref;
            const headSha = pr.data.head.sha;
            const headRepo = pr.data.head.repo; // null when the fork has been deleted

            if (!headRepo) {
              await comment(
                '⛔ Cannot run `/ci`: the head repository of this PR no longer exists.',
              );
              return;
            }
            // Compare full names rather than head.repo.fork: `fork` is also true for a fork of
            // some other repo, and is unreadable (null repo) once a fork is deleted.
            const isFork = headRepo.full_name !== `${owner}/${repo}`;

            // `/ci <sha>` pins the run to the commit the maintainer reviewed, so a push to the
            // fork between review and comment cannot silently swap the code being run.
            if (arg && !headSha.startsWith(arg.toLowerCase())) {
              await comment(
                `⛔ \`/ci ${arg}\` does not match the current head \`${headSha}\`. ` +
                'The PR moved; re-review and comment again.',
              );
              return;
            }

            let ref = branch;
            let mirrorNote = '';
            // Everything below talks to the refs/dispatch APIs; the catch at the end reports any
            // failure back onto the PR (kept unindented to keep this diff readable).
            try {
            if (isFork) {
              // Build the mirror tree: fork head tree, with `.github/` taken from the PR's own
              // base branch so only trusted workflow definitions ever run with secrets. Using the
              // base branch rather than the default branch matters for PRs onto rel-*, whose
              // pipelines pin different SDK versions and runner labels.
              const baseBranch = pr.data.base.ref;
              const baseRef = await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${baseBranch}`,
              });
              const baseCommit = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: baseRef.data.object.sha,
              });
              const baseTree = await github.rest.git.getTree({
                owner,
                repo,
                tree_sha: baseCommit.data.tree.sha,
              });
              const trustedDotGithub = baseTree.data.tree.find((e) => e.path === '.github');
              if (!trustedDotGithub) {
                throw new Error(`No .github tree on ${baseBranch}; refusing to mirror fork code.`);
              }

              // Fork PR objects are reachable from the base repo, so the fork head commit can be
              // read and used as base_tree / parent here.
              const forkCommit = await github.rest.git.getCommit({
                owner,
                repo,
                commit_sha: headSha,
              });
              const mirrorTree = await github.rest.git.createTree({
                owner,
                repo,
                base_tree: forkCommit.data.tree.sha,
                tree: [
                  { path: '.github', mode: '040000', type: 'tree', sha: trustedDotGithub.sha },
                ],
              });
              const mirrorCommit = await github.rest.git.createCommit({
                owner,
                repo,
                message:
                  `CI mirror of #${issue_number} at ${headSha} ` +
                  `(.github from ${baseBranch}), requested by @${context.actor}`,
                tree: mirrorTree.data.sha,
                parents: [headSha],
              });

              ref = `ci-fork/pr-${issue_number}`;
              const refName = `heads/${ref}`;
              try {
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: refName,
                  sha: mirrorCommit.data.sha,
                  force: true,
                });
              } catch (e) {
                if (e.status !== 422 && e.status !== 404) throw e;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/${refName}`,
                  sha: mirrorCommit.data.sha,
                });
              }
              mirrorNote =
                ` Fork head \`${headSha.slice(0, 10)}\` was mirrored to \`${ref}\` with ` +
                `\`.github/\` from \`${baseBranch}\`, so results appear on the mirror commit, ` +
                'not on this PR.';
            }

            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'qualcomm-internal-ci.yml',
              ref,
            });

            const runs =
              `${context.serverUrl}/${owner}/${repo}/actions/workflows/` +
              `qualcomm-internal-ci.yml?query=branch%3A${encodeURIComponent(ref)}`;
            const draftNote = pr.data.draft ? ' (draft PR — CI does not run on push)' : '';
            await comment(
              `🔄 CI triggered on \`${ref}\`${draftNote} by @${context.actor}.${mirrorNote} ` +
              `[View runs](${runs}).`,
            );
            } catch (e) {
              // Mirroring and dispatch can fail for reasons the maintainer cannot see from the
              // PR (a ruleset blocking ci-fork/*, a ref not yet visible to the dispatch). Say so
              // on the PR, then fail the run so it is also visible in the Actions tab.
              await comment(`⛔ \`/ci\` failed: ${e.message}`);
              throw e;
            }
