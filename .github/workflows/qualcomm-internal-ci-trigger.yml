# Lets a maintainer trigger CI by commenting "/ci" (optionally "/ci <sha>") on a PR.
# Two cases it exists for:
#   * draft PRs, which don't auto-trigger CI (see qualcomm-internal-ci.yml);
#   * fork PRs, where Tier 2 (device/QDC/wheel-smoke) is skipped because forks get no secrets.
#
# Fork handling. workflow_dispatch resolves BOTH the ref to build and the workflow definitions
# from the dispatched ref, and a fork head branch does not exist in this repo (dispatching it
# fails 422 "No ref found"). So a fork PR is mirrored to a branch named
# `ci-fork/pr-<number>-<fork sha>-<base sha>`, holding a commit whose tree is the fork's tree with
# `.github/` replaced by the tree from the PR's base branch, so
# the workflow definitions, permissions and secret plumbing that run are always trusted ones and a
# fork cannot inject `run:` steps into a secrets-bearing workflow. The base branch is allowlisted
# to the same refs qualcomm-internal-ci.yml itself runs on. A fork's edits under `.github/` are
# therefore NOT exercised by `/ci`; review those by reading the diff.
#
# What `/ci` still does is build and test the fork's source and build scripts (qcom/, cmake,
# tests) on internal runners with Artifactory/QDC secrets in the environment. That is inherent
# to running fork code at all, so `/ci` is a deliberate maintainer action: read the diff first.
# Only users with write/maintain/admin permission on this repo can trigger it — author_association
# is a cheap prefilter only (it reports COLLABORATOR for read-only collaborators and MEMBER for
# any org member), so the real check is repos.getCollaboratorPermissionLevel below.
#
# The ref name pins both inputs to the mirror, so a second `/ci` creates a new ref rather than
# moving one out from under a running job, and the run list for a ref is unambiguous about which
# fork commit was tested against which base. Mirror commits
# have their own SHA, so Tier 2 results land on the mirror rather than the PR head: they do not
# overwrite the PR's green Tier-2 placeholders (a fork PR stays mergeable), and are read from the
# run link in the acknowledgement comment. Stale mirrors are removed by
# qualcomm-internal-ci-mirror-sweep.yml.

name: Qualcomm Internal CI Trigger

permissions: {}

on:
  issue_comment:
    types: [created]

# Serialize per PR so two quick `/ci` comments are handled in order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  trigger:
    name: Trigger CI from PR comment
    # Prefilter, so unrelated comments don't claim a runner for a job holding write scopes. The
    # command must be the whole comment or be followed by a space: expression strings have no
    # escape sequences, so a newline cannot be matched here (the old `'/ci\n'` test was the dead
    # literal `/ci\n`). author_association is checked again in the script, where it can be turned
    # into a real permission lookup.
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.body == '/ci' ||
       startsWith(github.event.comment.body, '/ci ')) &&
      contains(fromJSON('["COLLABORATOR", "MEMBER", "OWNER"]'),
               github.event.comment.author_association)
    permissions:
      contents: write       # to create the ci-fork/pr-<number>-... mirror ref for fork PRs
      pull-requests: write  # to post the acknowledgement comment
      actions: write        # to dispatch qualcomm-internal-ci.yml and cancel superseded runs
    runs-on: ["self-hosted", "X64", "Linux", "Build"]
    steps:
      - name: Dispatch CI workflow on PR branch
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comment = (body) =>
              github.rest.issues.createComment({ owner, repo, issue_number, body });

            // The job `if` is a prefilter: parse the command precisely here. Returning without a
            // comment keeps unrelated messages (and unprivileged commenters) from making the bot
            // speak at all.
            const firstLine = context.payload.comment.body.split(/\r?\n/, 1)[0].trim();
            if (!/^\/ci(\s|$)/.test(firstLine)) return; // e.g. "/citation", not the command
            const arg = firstLine.slice('/ci'.length).trim();

            try {
              // author_association in the job `if` does not imply write access: COLLABORATOR
              // includes read/triage-only collaborators and MEMBER is any org member. Check the
              // real permission level first, before this job echoes any comment content back or
              // touches refs, so an unprivileged commenter cannot use the bot as a mouthpiece.
              // The endpoint 404s for a user with no access at all, which is also "no permission".
              let permission = 'none';
              try {
                const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: context.actor,
                });
                permission = perm.data.permission;
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              if (!['admin', 'write'].includes(permission)) {
                await comment(
                  `⛔ \`/ci\` needs write access to this repository (@${context.actor} has ` +
                  `\`${permission}\`).`,
                );
                return;
              }

              // Anything after `/ci` must be a commit sha. A malformed argument is rejected
              // rather than silently treated as an unpinned run. Echo it back defanged.
              if (arg && !/^[0-9a-f]{7,40}$/i.test(arg)) {
                const shown = arg.replace(/[`\r\n]/g, ' ').slice(0, 40);
                await comment(
                  `⛔ Could not read \`${shown}\` as a commit sha. Use \`/ci\` to run against ` +
                  'the current head, or `/ci <sha>` (7-40 hex chars) to pin a reviewed commit.',
                );
                return;
              }

              const pr = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
              if (pr.data.state !== 'open') {
                // A mirror created here would outlive the close transition the sweep keys on.
                await comment(`⛔ \`/ci\` only runs on open PRs (this one is ${pr.data.state}).`);
                return;
              }

              const branch = pr.data.head.ref;
              const headSha = pr.data.head.sha;
              const headRepo = pr.data.head.repo; // null when the fork has been deleted
              if (!headRepo) {
                await comment(
                  '⛔ Cannot run `/ci`: the head repository of this PR no longer exists.',
                );
                return;
              }
              // Compare full names rather than head.repo.fork: `fork` is also true for a fork of
              // some other repo, and is unreadable (null repo) once a fork is deleted.
              const isFork = headRepo.full_name !== `${owner}/${repo}`;

              // `/ci <sha>` pins the run to the commit the maintainer reviewed, so a push to the
              // fork between review and comment cannot silently swap the code being run. For a
              // non-fork PR the dispatch is by branch name, which workflow_dispatch re-resolves,
              // so there the pin is a best-effort check rather than a guarantee.
              if (arg && !headSha.startsWith(arg.toLowerCase())) {
                await comment(
                  `⛔ \`/ci ${arg}\` does not match the current head \`${headSha}\`. ` +
                  'The PR moved; re-review and comment again.',
                );
                return;
              }

              let ref = branch;
              let mirrorNote = '';
              if (isFork) {
                // The mirror's `.github/` is the trust anchor, so it must come from a branch this
                // repo actually gates. qualcomm-internal-ci.yml runs on main and rel branches;
                // allowlist the same set rather than trusting any base a PR happens to target.
                const baseBranch = pr.data.base.ref;
                const baseAllowed =
                  baseBranch === pr.data.base.repo.default_branch ||
                  /^rel-/.test(baseBranch) ||
                  /^rel\//.test(baseBranch);
                if (!baseAllowed) {
                  await comment(
                    `⛔ \`/ci\` on a fork PR needs a \`main\` or \`rel-*\` base to take trusted ` +
                    `workflows from; this PR targets \`${baseBranch}\`.`,
                  );
                  return;
                }

                const baseRef = await github.rest.git.getRef({
                  owner,
                  repo,
                  ref: `heads/${baseBranch}`,
                });
                const baseCommit = await github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: baseRef.data.object.sha,
                });
                const baseTree = await github.rest.git.getTree({
                  owner,
                  repo,
                  tree_sha: baseCommit.data.tree.sha,
                });
                const trustedDotGithub = baseTree.data.tree.find((e) => e.path === '.github');
                if (!trustedDotGithub) {
                  throw new Error(
                    `No .github tree on ${baseBranch}; refusing to mirror fork code.`,
                  );
                }

                // Fork PR objects are reachable from the base repo, so the fork head commit can
                // be read and used as base_tree / parent here.
                const forkCommit = await github.rest.git.getCommit({
                  owner,
                  repo,
                  commit_sha: headSha,
                });
                const mirrorTree = await github.rest.git.createTree({
                  owner,
                  repo,
                  base_tree: forkCommit.data.tree.sha,
                  tree: [
                    { path: '.github', mode: '040000', type: 'tree', sha: trustedDotGithub.sha },
                  ],
                });
                // The trust boundary is createTree replacing the `.github` subtree outright rather
                // than merging into it (verified against the API: fork-only files under .github/
                // do not survive). Assert it, so a change in that behaviour fails loudly here
                // instead of quietly carrying fork-authored files into a privileged run.
                const mirrored = mirrorTree.data.tree.find((e) => e.path === '.github');
                if (!mirrored || mirrored.sha !== trustedDotGithub.sha) {
                  throw new Error(
                    `Mirror .github is ${mirrored ? mirrored.sha : 'missing'}, expected ` +
                    `${trustedDotGithub.sha}; refusing to dispatch fork code.`,
                  );
                }
                const mirrorCommit = await github.rest.git.createCommit({
                  owner,
                  repo,
                  message:
                    `CI mirror of #${issue_number} at ${headSha} ` +
                    `(.github from ${baseBranch}), requested by @${context.actor}`,
                  tree: mirrorTree.data.sha,
                  parents: [headSha],
                });

                // The ref name pins both inputs to the mirror — the fork commit and the base
                // commit the trusted `.github/` came from — so a given ref always denotes the same
                // content and is never force-moved under a job that is about to check it out.
                // A repeat `/ci` with both unchanged reuses the existing ref as-is.
                ref =
                  `ci-fork/pr-${issue_number}-${headSha.slice(0, 12)}-` +
                  `${baseRef.data.object.sha.slice(0, 8)}`;
                try {
                  await github.rest.git.createRef({
                    owner,
                    repo,
                    ref: `refs/heads/${ref}`,
                    sha: mirrorCommit.data.sha,
                  });
                } catch (e) {
                  if (e.status !== 422) throw e; // 422: identical mirror already exists, reuse it
                }
                mirrorNote =
                  ` Fork head \`${headSha.slice(0, 10)}\` was mirrored to \`${ref}\` with ` +
                  `\`.github/\` from \`${baseBranch}\`, so results appear on the mirror commit, ` +
                  'not on this PR.';
              }

              // Supersede an earlier `/ci` on the same ref: qualcomm-internal-ci.yml's own
              // concurrency group falls back to run_id for workflow_dispatch, so it will not
              // cancel these itself, and two live Tier-2 runs contend for the same device slots.
              const prior = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'qualcomm-internal-ci.yml',
                branch: ref,
                event: 'workflow_dispatch',
              });
              for (const run of prior.data.workflow_runs) {
                if (run.status !== 'completed') {
                  await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
                }
              }

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'qualcomm-internal-ci.yml',
                ref,
              });

              const runs =
                `${context.serverUrl}/${owner}/${repo}/actions/workflows/` +
                `qualcomm-internal-ci.yml?query=branch%3A${encodeURIComponent(ref)}`;
              const draftNote = pr.data.draft ? ' (draft PR — CI does not run on push)' : '';
              await comment(
                `🔄 CI triggered on \`${ref}\`${draftNote} by @${context.actor}.${mirrorNote} ` +
                `[View runs](${runs}).`,
              );
            } catch (e) {
              // Failures here (a ruleset blocking ci-fork/*, a transient API error) are otherwise
              // invisible: issue_comment runs are not surfaced as checks on the PR. Say so on the
              // PR, then fail the run so it also shows in the Actions tab. Commenting can itself
              // fail (locked conversation, rate limit); never let that replace the real error.
              try {
                await comment(`⛔ \`/ci\` failed: ${e.message}`);
              } catch (notifyError) {
                core.warning(`Could not report the failure on the PR: ${notifyError.message}`);
              }
              throw e;
            }
