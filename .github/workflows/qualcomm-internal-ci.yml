name: Qualcomm Internal PR Workflow

permissions:
  contents: read
  checks: write
  pull-requests: write

on:
  push:
    branches: [main, rel-*, rel/**/*]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, rel-*, rel/**/*]
  merge_group:
    types: [checks_requested]

  # Allow this workflow to be run manually from the Actions tab
  workflow_dispatch:
    inputs:
      full_tier1:
        description: "Also run coverage and ASan (full build: a dispatch has no diff base)"
        type: boolean
        default: false

# only one active job per PR. this will cause jobs to be immediately cancelled on subsequent pushes in PRs.
# ref: https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build-and-test-all:
    name: Build & Test
    # Draft PRs don't auto-trigger CI: push to a draft runs nothing. CI fires when the PR is
    # marked ready-for-review, or on manual workflow_dispatch. Drafts can't merge, so skipping
    # their (required) checks blocks nothing. Non-PR events (push/merge_group/dispatch) always run.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    uses: ./.github/workflows/qualcomm-internal-build-and-test.yml
    secrets: inherit
    with:
      do_all: true

  # coverage and asan are Tier-1 pre-merge gates: non-draft PRs (forks included, since neither
  # needs secrets), the merge queue, and any dispatch that asks for them. They do not run on push,
  # nor on a plain dispatch: neither has a diff base, so both callees fall back to a full build, and
  # on push to main that adds nothing over the PR run (per-file coverage for main comes from the
  # nightly). `/ci` sets full_tier1 for a draft PR, where nothing has run on push yet, and leaves it
  # off for a ready PR, which already got Tier 1 — the point of `/ci` there is Tier 2.
  # format() rather than a bare comparison: the value is a boolean by dispatch input type but a
  # string over the REST API.
  coverage:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && format('{0}', inputs.full_tier1) == 'true') }}
    uses: ./.github/workflows/qualcomm-internal-coverage.yml
    secrets: inherit

  asan:
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.draft == false) || github.event_name == 'merge_group' || (github.event_name == 'workflow_dispatch' && format('{0}', inputs.full_tier1) == 'true') }}
    uses: ./.github/workflows/qualcomm-internal-asan.yml
    secrets: inherit
